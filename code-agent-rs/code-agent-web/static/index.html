<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Agent - Management Panel</title>
<style>
/* ── Design System Tokens ─────────────────────────────────────────────── */
:root {
  --bg-root: #1e1e1e;
  --bg-panel: #252526;
  --bg-input: #2d2d30;
  --bg-hover: #2a2d2e;
  --bg-active: #37373d;
  --bg-tool: #1e2b1e;
  --border: #3c3c3c;
  --border-light: #474747;
  --text-primary: #cccccc;
  --text-secondary: #808080;
  --text-muted: #5a5a5a;
  --accent: #007acc;
  --accent-hover: #1a8ad4;
  --accent-dim: #094771;
  --user-color: #569cd6;
  --assistant-color: #ce9178;
  --tool-color: #6a9955;
  --error-color: #f44747;
  --success-color: #4ec9b0;
  --warning-color: #cca700;
  --token-color: #c586c0;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 12px;
  --space-lg: 16px;
  --space-xl: 24px;
  --font-mono: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --transition-fast: 120ms ease;
  --transition-normal: 200ms ease;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
}

/* ── Reset & Base ─────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.5;
  color: var(--text-primary);
  background: var(--bg-root);
  display: flex;
  flex-direction: column;
}

/* Scrollbar styling */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #424242; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #555; }

/* ── Header ───────────────────────────────────────────────────────────── */
#header {
  height: 40px;
  min-height: 40px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 var(--space-lg);
  gap: var(--space-md);
  z-index: 10;
  -webkit-app-region: drag;
}
#header-logo { font-size: 14px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.2px; }
#header-logo span { color: var(--accent); }
#header-spacer { flex: 1; }
#health-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #555;
  transition: background var(--transition-normal);
  flex-shrink: 0;
}
#health-dot.online { background: var(--success-color); box-shadow: 0 0 6px rgba(78,201,176,0.4); }
#health-dot.offline { background: var(--error-color); }
#health-label { font-size: 11px; color: var(--text-secondary); }
#conn-status { font-size: 11px; color: var(--text-muted); }

/* ── Three-Column Layout ──────────────────────────────────────────────── */
#app { display: flex; flex: 1; overflow: hidden; }

/* ── Sidebar ──────────────────────────────────────────────────────────── */
#sidebar {
  width: 260px;
  min-width: 200px;
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#sidebar-header {
  padding: var(--space-md) var(--space-lg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
#sidebar-header h2 {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--text-secondary);
  letter-spacing: 0.8px;
}
#thread-count {
  font-size: 11px;
  color: var(--text-muted);
  background: var(--bg-input);
  padding: 2px 8px;
  border-radius: 10px;
}
#new-thread-btn {
  margin: var(--space-sm) var(--space-lg);
  padding: var(--space-sm) var(--space-md);
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  transition: background var(--transition-fast);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
#new-thread-btn:hover { background: var(--accent-hover); }
#new-thread-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
#thread-list { flex: 1; overflow-y: auto; padding: 0 var(--space-sm); }
.thread-item {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  padding: var(--space-sm) var(--space-md);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 12px;
  color: var(--text-secondary);
  transition: background var(--transition-fast), color var(--transition-fast);
  margin-bottom: 1px;
  position: relative;
}
.thread-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.thread-item.active { background: var(--bg-active); color: #fff; }
.thread-item-icon {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--text-muted);
  flex-shrink: 0;
  transition: background var(--transition-fast);
}
.thread-item.active .thread-item-icon { background: var(--accent); }
.thread-item-label {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.thread-item-del {
  opacity: 0;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 14px;
  line-height: 1;
  padding: 2px 4px;
  border-radius: 3px;
  transition: opacity var(--transition-fast), color var(--transition-fast), background var(--transition-fast);
  flex-shrink: 0;
}
.thread-item:hover .thread-item-del { opacity: 1; }
.thread-item-del:hover { color: var(--error-color); background: rgba(244,71,71,0.15); }
#sidebar-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  color: var(--text-muted);
  font-size: 12px;
  text-align: center;
  padding: var(--space-xl);
  gap: var(--space-sm);
}
#sidebar-error {
  padding: var(--space-sm) var(--space-lg);
  font-size: 11px;
  color: var(--error-color);
  background: rgba(244,71,71,0.08);
  margin: var(--space-sm);
  border-radius: var(--radius-sm);
  display: none;
}

/* ── Main Chat Area ───────────────────────────────────────────────────── */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* Chat header (thread info bar) */
#chat-header {
  padding: var(--space-sm) var(--space-lg);
  background: var(--bg-input);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: var(--space-md);
  font-size: 12px;
  min-height: 36px;
}
#chat-header .thread-id-display { color: var(--text-primary); font-family: var(--font-mono); font-size: 11px; }
#chat-header .thread-info-spacer { flex: 1; }
#chat-header .thread-info-badge {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--accent-dim);
  color: var(--accent);
  font-weight: 500;
}

/* Messages */
#messages {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-lg);
  display: flex;
  flex-direction: column;
  gap: var(--space-lg);
}
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  color: var(--text-muted);
  gap: var(--space-md);
}
.empty-state-icon { opacity: 0.3; }
.empty-state-icon svg { width: 64px; height: 64px; }
.empty-state-text { font-size: 14px; color: var(--text-muted); }
.empty-state-hint { font-size: 12px; color: var(--text-muted); opacity: 0.7; }

/* Message bubble */
.msg {
  display: flex;
  flex-direction: column;
  gap: var(--space-xs);
  animation: msgSlideIn 250ms ease-out;
}
@keyframes msgSlideIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.msg-header {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  font-size: 11px;
  font-weight: 600;
}
.msg-header .role-badge {
  padding: 2px 8px;
  border-radius: var(--radius-sm);
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 0.3px;
}
.msg-header .role-badge.user { background: rgba(86,156,214,0.15); color: var(--user-color); }
.msg-header .role-badge.assistant { background: rgba(206,145,120,0.15); color: var(--assistant-color); }
.msg-header .role-badge.system { background: rgba(204,204,204,0.1); color: var(--text-secondary); }
.msg-header .role-badge.error { background: rgba(244,71,71,0.15); color: var(--error-color); }
.msg-time { color: var(--text-muted); font-size: 10px; }
.msg-body {
  padding: var(--space-md);
  border-radius: var(--radius-md);
  line-height: 1.6;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.msg.user .msg-body { background: rgba(86,156,214,0.08); border-left: 2px solid var(--user-color); color: #d4e2f2; }
.msg.assistant .msg-body { background: rgba(206,145,120,0.05); border-left: 2px solid var(--assistant-color); color: #e8d5c8; }
.msg.system .msg-body { background: transparent; border-left: 2px solid var(--border); color: var(--text-secondary); font-size: 11px; }
.msg.error .msg-body { background: rgba(244,71,71,0.06); border-left: 2px solid var(--error-color); color: #f4a0a0; }

/* Markdown-like styling within msg-body */
.msg-body code {
  background: rgba(0,0,0,0.3);
  padding: 1px 5px;
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--assistant-color);
}
.msg-body pre {
  background: #0d0d0d;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: var(--space-md);
  overflow-x: auto;
  margin: var(--space-sm) 0;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.5;
}
.msg-body pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
.msg-body strong { color: #e0e0e0; }
.msg-body em { color: #d0d0d0; }
.msg-body ul, .msg-body ol { padding-left: var(--space-xl); margin: var(--space-xs) 0; }
.msg-body p { margin: var(--space-xs) 0; }
.msg-body p:first-child { margin-top: 0; }
.msg-body p:last-child { margin-bottom: 0; }
.msg-body blockquote {
  border-left: 2px solid var(--accent);
  padding-left: var(--space-md);
  color: var(--text-secondary);
  margin: var(--space-sm) 0;
}
.msg-body h1, .msg-body h2, .msg-body h3, .msg-body h4 {
  color: var(--text-primary);
  margin: var(--space-md) 0 var(--space-xs);
  font-weight: 600;
}
.msg-body h1 { font-size: 18px; }
.msg-body h2 { font-size: 16px; }
.msg-body h3 { font-size: 14px; }
.msg-body h4 { font-size: 13px; }
.msg-body a { color: var(--accent); text-decoration: none; }
.msg-body a:hover { text-decoration: underline; }
.msg-body hr { border: none; border-top: 1px solid var(--border); margin: var(--space-md) 0; }
.msg-body table { border-collapse: collapse; width: 100%; margin: var(--space-sm) 0; }
.msg-body th, .msg-body td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; font-size: 12px; }
.msg-body th { background: var(--bg-input); font-weight: 600; }

/* Tool call accordion */
.tool-call-wrapper {
  margin: var(--space-sm) 0;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
  animation: msgSlideIn 200ms ease-out;
}
.tool-call-toggle {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  width: 100%;
  padding: var(--space-sm) var(--space-md);
  background: var(--bg-tool);
  border: none;
  color: var(--tool-color);
  cursor: pointer;
  font-size: 12px;
  font-family: var(--font-mono);
  text-align: left;
  transition: background var(--transition-fast);
}
.tool-call-toggle:hover { background: #243224; }
.tool-call-toggle .tool-icon { font-size: 14px; }
.tool-call-toggle .tool-name { font-weight: 600; color: #89d185; }
.tool-call-toggle .tool-chevron {
  margin-left: auto;
  transition: transform var(--transition-fast);
  font-size: 10px;
}
.tool-call-toggle.open .tool-chevron { transform: rotate(90deg); }
.tool-call-body {
  display: none;
  padding: var(--space-md);
  background: rgba(0,0,0,0.2);
  border-top: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.5;
  max-height: 300px;
  overflow-y: auto;
}
.tool-call-body.open { display: block; }
.tool-call-body .tool-section { margin-bottom: var(--space-sm); }
.tool-call-body .tool-section-label {
  font-size: 10px;
  text-transform: uppercase;
  color: var(--text-muted);
  letter-spacing: 0.5px;
  margin-bottom: 2px;
}
.tool-call-body .tool-section-content {
  color: var(--text-secondary);
  white-space: pre-wrap;
}

/* Token usage bar */
.token-usage {
  display: flex;
  align-items: center;
  gap: var(--space-md);
  padding: var(--space-sm) var(--space-md);
  background: rgba(197,134,192,0.06);
  border: 1px solid rgba(197,134,192,0.15);
  border-radius: var(--radius-sm);
  font-size: 11px;
  color: var(--token-color);
  font-family: var(--font-mono);
  margin: var(--space-xs) 0;
  animation: msgSlideIn 200ms ease-out;
}
.token-usage .token-stat { display: flex; align-items: center; gap: 4px; }
.token-usage .token-label { color: var(--text-muted); font-size: 10px; }

/* Streaming cursor */
.streaming-cursor {
  display: inline-block;
  width: 8px; height: 15px;
  background: var(--accent);
  animation: blink 0.8s steps(1) infinite;
  vertical-align: text-bottom;
  margin-left: 1px;
}
@keyframes blink { 50% { opacity: 0; } }

/* ── Input Area ───────────────────────────────────────────────────────── */
#input-area {
  border-top: 1px solid var(--border);
  padding: var(--space-md) var(--space-lg);
  background: var(--bg-panel);
}
#input-row {
  display: flex;
  gap: var(--space-sm);
  align-items: flex-end;
}
#input-row textarea {
  flex: 1;
  background: var(--bg-input);
  color: var(--text-primary);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--space-sm) var(--space-md);
  font-size: 13px;
  font-family: var(--font-sans);
  line-height: 1.5;
  resize: none;
  min-height: 38px;
  max-height: 150px;
  transition: border-color var(--transition-fast);
}
#input-row textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(0,122,204,0.15);
}
#input-row textarea:disabled { opacity: 0.4; cursor: not-allowed; }
#input-row textarea::placeholder { color: var(--text-muted); }
#send-btn, #cancel-btn {
  padding: var(--space-sm) var(--space-lg);
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: all var(--transition-fast);
  white-space: nowrap;
  height: 38px;
  display: flex;
  align-items: center;
  gap: 6px;
}
#send-btn {
  background: var(--accent);
  color: #fff;
}
#send-btn:hover:not(:disabled) { background: var(--accent-hover); }
#send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
#cancel-btn {
  background: var(--bg-input);
  color: var(--text-secondary);
  border: 1px solid var(--border);
  display: none;
}
#cancel-btn:hover { color: var(--text-primary); border-color: var(--border-light); }
#cancel-btn.visible { display: flex; }
#input-hint {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 4px;
  text-align: right;
}

/* ── Thread Info Panel (Right) ────────────────────────────────────────── */
#info-panel {
  width: 300px;
  min-width: 220px;
  background: var(--bg-panel);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#info-panel-header {
  padding: var(--space-md) var(--space-lg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
#info-panel-header h2 {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--text-secondary);
  letter-spacing: 0.8px;
}
#info-panel-toggle {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 14px;
  padding: 2px 6px;
  border-radius: 3px;
}
#info-panel-toggle:hover { color: var(--text-primary); background: var(--bg-hover); }
#info-panel-content {
  flex: 1;
  overflow-y: auto;
  padding: var(--space-lg);
  display: flex;
  flex-direction: column;
  gap: var(--space-lg);
}
#info-panel.empty #info-panel-content {
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 12px;
}
.info-section {}
.info-section h3 {
  font-size: 10px;
  text-transform: uppercase;
  color: var(--text-muted);
  letter-spacing: 0.5px;
  margin-bottom: var(--space-sm);
}
.info-field {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: var(--space-xs) 0;
  font-size: 12px;
  gap: var(--space-sm);
}
.info-field .field-label { color: var(--text-secondary); white-space: nowrap; }
.info-field .field-value {
  color: var(--text-primary);
  text-align: right;
  word-break: break-all;
  font-family: var(--font-mono);
  font-size: 11px;
}

/* ── Toast Notifications ──────────────────────────────────────────────── */
#toast-container {
  position: fixed;
  bottom: var(--space-lg);
  right: var(--space-lg);
  z-index: 1000;
  display: flex;
  flex-direction: column-reverse;
  gap: var(--space-sm);
}
.toast {
  padding: var(--space-sm) var(--space-md);
  border-radius: var(--radius-sm);
  font-size: 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  color: var(--text-primary);
  box-shadow: var(--shadow-md);
  animation: toastSlideIn 300ms ease-out;
  max-width: 350px;
}
.toast.error { border-color: var(--error-color); color: var(--error-color); }
.toast.success { border-color: var(--success-color); color: var(--success-color); }
@keyframes toastSlideIn {
  from { opacity: 0; transform: translateX(20px); }
  to   { opacity: 1; transform: translateX(0); }
}

/* ── Responsive ───────────────────────────────────────────────────────── */
@media (max-width: 900px) {
  #info-panel { display: none; }
}
@media (max-width: 600px) {
  #sidebar { width: 200px; min-width: 160px; }
  #messages { padding: var(--space-md); }
}
</style>
</head>
<body>

<!-- Header -->
<div id="header">
  <div id="header-logo"><span>&#x25B6;</span> Code Agent</div>
  <div id="header-spacer"></div>
  <div id="health-dot" title="Server health"></div>
  <span id="health-label">server</span>
  <span id="conn-status">-</span>
</div>

<!-- Three-column app layout -->
<div id="app">
  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-header">
      <h2>Threads</h2>
      <span id="thread-count">0</span>
    </div>
    <button id="new-thread-btn">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 2a.75.75 0 0 1 .75.75v4.5h4.5a.75.75 0 0 1 0 1.5h-4.5v4.5a.75.75 0 0 1-1.5 0v-4.5h-4.5a.75.75 0 0 1 0-1.5h4.5v-4.5A.75.75 0 0 1 8 2z"/></svg>
      New Thread
    </button>
    <div id="sidebar-error"></div>
    <div id="thread-list"></div>
    <div id="sidebar-empty" style="display:none">
      <svg width="32" height="32" viewBox="0 0 16 16" fill="currentColor" opacity="0.2"><path d="M2 2.75C2 1.784 2.784 1 3.75 1h8.5c.966 0 1.75.784 1.75 1.75v7.5A1.75 1.75 0 0 1 12.25 12H9.06l-2.573 2.573A1.458 1.458 0 0 1 4 13.543V12H3.75A1.75 1.75 0 0 1 2 10.25z"/></svg>
      No threads yet
    </div>
  </div>

  <!-- Main Chat -->
  <div id="main">
    <div id="chat-header">
      <span class="thread-id-display">No thread selected</span>
      <span class="thread-info-spacer"></span>
    </div>
    <div id="messages">
      <div class="empty-state">
        <div class="empty-state-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8.625 9.75a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0m0 0H8.25m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0m0 0H12m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0m0 0h-.375m-13.5 3.01c0 1.6 1.123 2.994 2.707 3.227 1.087.16 2.185.283 3.293.369V21l4.184-4.183a1.14 1.14 0 0 1 .778-.332 48.294 48.294 0 0 0 5.83-.498c1.585-.233 2.708-1.626 2.708-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741z"/></svg>
        </div>
        <div class="empty-state-text">Select or create a thread</div>
        <div class="empty-state-hint">Create a new thread to start chatting with the agent</div>
      </div>
    </div>
    <div id="input-area">
      <div id="input-row">
        <textarea id="input" placeholder="Type a message... (Enter to send, Shift+Enter for new line)" rows="1" disabled></textarea>
        <button id="send-btn" disabled>Send</button>
        <button id="cancel-btn" title="Cancel streaming">Stop</button>
      </div>
      <div id="input-hint">Shift+Enter for new line</div>
    </div>
  </div>

  <!-- Info Panel -->
  <div id="info-panel" class="empty">
    <div id="info-panel-header">
      <h2>Thread Info</h2>
      <button id="info-panel-toggle" title="Toggle panel">&times;</button>
    </div>
    <div id="info-panel-content">
      <span style="color:var(--text-muted);font-size:12px;">Select a thread to view details</span>
    </div>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// Code Agent Web UI - Vanilla SPA
// ═══════════════════════════════════════════════════════════════════════════

// ── State ────────────────────────────────────────────────────────────────
const STATE = {
  threads: [],          // list of thread IDs from GET /threads
  activeThreadId: null, // currently selected thread
  streaming: false,     // SSE stream in progress
  streamAbort: null,    // AbortController for current stream
  apiKey: localStorage.getItem('code_agent_api_key') || '',
  healthOnline: false,
  eventHistory: {},     // thread_id -> parsed events array
};

// ── DOM refs ─────────────────────────────────────────────────────────────
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

const DOM = {
  healthDot: $('#health-dot'),
  healthLabel: $('#health-label'),
  connStatus: $('#conn-status'),
  threadCount: $('#thread-count'),
  threadList: $('#thread-list'),
  sidebarEmpty: $('#sidebar-empty'),
  sidebarError: $('#sidebar-error'),
  newThreadBtn: $('#new-thread-btn'),
  chatHeader: $('#chat-header'),
  messages: $('#messages'),
  input: $('#input'),
  sendBtn: $('#send-btn'),
  cancelBtn: $('#cancel-btn'),
  infoPanel: $('#info-panel'),
  infoPanelContent: $('#info-panel-content'),
  infoPanelToggle: $('#info-panel-toggle'),
  toastContainer: $('#toast-container'),
};

// ── API Client ───────────────────────────────────────────────────────────
const BASE = '';

function authHeaders(headers = {}) {
  const h = { 'Content-Type': 'application/json', ...headers };
  if (STATE.apiKey) h['Authorization'] = `Bearer ${STATE.apiKey}`;
  return h;
}

async function apiFetch(path, options = {}) {
  const res = await fetch(`${BASE}${path}`, {
    ...options,
    headers: authHeaders(options.headers),
  });
  if (!res.ok) {
    let msg = `HTTP ${res.status}`;
    try {
      const body = await res.json();
      msg = body.error || msg;
    } catch {}
    throw new Error(msg);
  }
  return res;
}

// ── Toast ────────────────────────────────────────────────────────────────
function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  DOM.toastContainer.appendChild(el);
  setTimeout(() => { el.remove(); }, 4000);
}

// ── Health Check ─────────────────────────────────────────────────────────
async function checkHealth() {
  try {
    const res = await fetch(`${BASE}/health`);
    if (res.ok) {
      STATE.healthOnline = true;
      DOM.healthDot.className = 'online';
      DOM.healthLabel.textContent = 'online';
    } else {
      throw new Error('unhealthy');
    }
  } catch {
    STATE.healthOnline = false;
    DOM.healthDot.className = 'offline';
    DOM.healthLabel.textContent = 'offline';
  }
}

// ── Thread Management ────────────────────────────────────────────────────
async function loadThreads() {
  try {
    const res = await apiFetch('/threads');
    const data = await res.json();
    STATE.threads = data.threads || [];
    renderThreadList();
    updateSidebarError(null);
  } catch (err) {
    STATE.threads = [];
    renderThreadList();
    updateSidebarError(`Failed to load threads: ${err.message}`);
  }
}

function renderThreadList() {
  DOM.threadCount.textContent = STATE.threads.length;

  if (STATE.threads.length === 0) {
    DOM.threadList.innerHTML = '';
    DOM.sidebarEmpty.style.display = 'flex';
    return;
  }

  DOM.sidebarEmpty.style.display = 'none';
  DOM.threadList.innerHTML = '';

  for (const tid of STATE.threads) {
    const item = document.createElement('div');
    item.className = `thread-item${tid === STATE.activeThreadId ? ' active' : ''}`;
    item.innerHTML = `
      <span class="thread-item-icon"></span>
      <span class="thread-item-label" title="${escapeAttr(tid)}">${escapeHtml(tid)}</span>
      <span class="thread-item-del" title="Delete thread">&times;</span>
    `;
    item.addEventListener('click', () => selectThread(tid));
    item.querySelector('.thread-item-del').addEventListener('click', (e) => {
      e.stopPropagation();
      deleteThread(tid);
    });
    DOM.threadList.appendChild(item);
  }
}

function updateSidebarError(msg) {
  if (msg) {
    DOM.sidebarError.textContent = msg;
    DOM.sidebarError.style.display = 'block';
  } else {
    DOM.sidebarError.style.display = 'none';
  }
}

async function createThread() {
  try {
    const res = await apiFetch('/threads', {
      method: 'POST',
      body: JSON.stringify({
        system_instructions: 'You are a helpful coding assistant with access to file, git, shell, and search tools. Be concise and accurate.',
        max_iterations: 20,
      }),
    });
    const data = await res.json();
    STATE.threads.push(data.thread_id);
    renderThreadList();
    selectThread(data.thread_id);
    toast('Thread created', 'success');
  } catch (err) {
    toast(`Failed to create thread: ${err.message}`, 'error');
  }
}

async function deleteThread(tid) {
  try {
    await apiFetch(`/threads/${encodeURIComponent(tid)}`, { method: 'DELETE' });
    STATE.threads = STATE.threads.filter(t => t !== tid);
    delete STATE.eventHistory[tid];
    if (STATE.activeThreadId === tid) {
      STATE.activeThreadId = null;
      clearChat();
      setInputEnabled(false);
      renderThreadInfo(null);
    }
    renderThreadList();
    toast('Thread deleted', 'success');
  } catch (err) {
    toast(`Failed to delete thread: ${err.message}`, 'error');
  }
}

async function selectThread(tid) {
  STATE.activeThreadId = tid;
  renderThreadList();
  setInputEnabled(true);
  DOM.input.focus();

  // Clear and show loading
  DOM.messages.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:var(--space-xl);">Loading history...</div>';

  // Load event history
  try {
    const res = await apiFetch(`/threads/${encodeURIComponent(tid)}/events`);
    const data = await res.json();
    const events = data.events || [];
    STATE.eventHistory[tid] = events;
    DOM.messages.innerHTML = '';
    if (events.length === 0) {
      showEmptyMessages('Thread is ready. Send a message to start.');
    }
    for (const event of events) {
      appendEvent(event);
    }
  } catch (err) {
    DOM.messages.innerHTML = '';
    showEmptyMessages('Could not load history. Send a message to start.');
  }

  renderThreadInfo(tid);
}

function clearChat() {
  DOM.messages.innerHTML = '';
  const empty = document.createElement('div');
  empty.className = 'empty-state';
  empty.innerHTML = `
    <div class="empty-state-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8.625 9.75a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0m0 0H8.25m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0m0 0H12m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0m0 0h-.375m-13.5 3.01c0 1.6 1.123 2.994 2.707 3.227 1.087.16 2.185.283 3.293.369V21l4.184-4.183a1.14 1.14 0 0 1 .778-.332 48.294 48.294 0 0 0 5.83-.498c1.585-.233 2.708-1.626 2.708-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741z"/></svg>
    </div>
    <div class="empty-state-text">Select or create a thread</div>
    <div class="empty-state-hint">Create a new thread to start chatting with the agent</div>
  `;
  DOM.messages.appendChild(empty);
}

function showEmptyMessages(msg) {
  DOM.messages.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'empty-state';
  div.innerHTML = `<div class="empty-state-text">${escapeHtml(msg)}</div>`;
  DOM.messages.appendChild(div);
}

function setInputEnabled(enabled) {
  DOM.input.disabled = !enabled;
  DOM.sendBtn.disabled = !enabled;
  if (!enabled) DOM.input.value = '';
}

// ── Thread Info Panel ────────────────────────────────────────────────────
function renderThreadInfo(tid) {
  if (!tid) {
    DOM.infoPanel.classList.add('empty');
    DOM.infoPanelContent.innerHTML = '<span style="color:var(--text-muted);font-size:12px;">Select a thread to view details</span>';
    DOM.chatHeader.innerHTML = '<span class="thread-id-display">No thread selected</span><span class="thread-info-spacer"></span>';
    return;
  }

  DOM.infoPanel.classList.remove('empty');
  const events = STATE.eventHistory[tid] || [];
  const turnCount = events.filter(e => Object.keys(e)[0] === 'turn_started').length;
  const msgCount = events.filter(e => Object.keys(e)[0] === 'agent_message_delta').length;
  const toolCount = events.filter(e => Object.keys(e)[0] === 'tool_call_begin').length;

  DOM.infoPanelContent.innerHTML = `
    <div class="info-section">
      <h3>Thread</h3>
      <div class="info-field"><span class="field-label">ID</span><span class="field-value">${escapeHtml(tid)}</span></div>
    </div>
    <div class="info-section">
      <h3>Statistics</h3>
      <div class="info-field"><span class="field-label">Turns</span><span class="field-value">${turnCount}</span></div>
      <div class="info-field"><span class="field-label">Messages</span><span class="field-value">${msgCount}</span></div>
      <div class="info-field"><span class="field-label">Tool Calls</span><span class="field-value">${toolCount}</span></div>
      <div class="info-field"><span class="field-label">Events</span><span class="field-value">${events.length}</span></div>
    </div>
    <div class="info-section">
      <h3>Connection</h3>
      <div class="info-field"><span class="field-label">Server</span><span class="field-value" style="color:${STATE.healthOnline ? 'var(--success-color)' : 'var(--error-color)'}">${STATE.healthOnline ? 'Online' : 'Offline'}</span></div>
    </div>
  `;

  DOM.chatHeader.innerHTML = `
    <span class="thread-id-display">${escapeHtml(tid)}</span>
    <span class="thread-info-spacer"></span>
    <span class="thread-info-badge">${turnCount} turns</span>
  `;
}

// ── Message Rendering ────────────────────────────────────────────────────
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function escapeAttr(str) {
  return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatTime() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

// Minimal markdown-to-HTML renderer
function renderMarkdown(text) {
  if (!text) return '';

  let html = escapeHtml(text);

  // Fenced code blocks (```lang\ncode\n```)
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    const langLabel = lang ? `<span style="color:var(--text-muted);font-size:10px;">${escapeHtml(lang)}</span>` : '';
    return `<pre>${langLabel}${escapeHtml(code)}</pre>`;
  });

  // Inline code (`code`)
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

  // Bold (**text**)
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

  // Italic (*text*)
  html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');

  // Headers
  html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

  // Unordered lists
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');

  // Blockquotes
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

  // Horizontal rules
  html = html.replace(/^---$/gm, '<hr>');

  // Paragraphs (double newlines)
  html = html.replace(/\n\n/g, '</p><p>');
  html = '<p>' + html + '</p>';
  html = html.replace(/<p>\s*<\/p>/g, '');

  // Links [text](url)
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  return html;
}

function addMessage(role, content, opts = {}) {
  // Remove empty state if present
  const empty = DOM.messages.querySelector('.empty-state');
  if (empty) empty.remove();

  const msgDiv = document.createElement('div');
  msgDiv.className = `msg ${role}`;
  msgDiv.dataset.role = role;

  const badge = { user: 'User', assistant: 'Assistant', system: 'System', error: 'Error' }[role] || role;

  msgDiv.innerHTML = `
    <div class="msg-header">
      <span class="role-badge ${role}">${badge}</span>
      <span class="msg-time">${opts.timestamp || formatTime()}</span>
    </div>
    <div class="msg-body">${role === 'assistant' ? renderMarkdown(content) : escapeHtml(content)}</div>
  `;

  DOM.messages.appendChild(msgDiv);
  scrollToBottom();
  return msgDiv;
}

function addTokenUsage(usage) {
  const empty = DOM.messages.querySelector('.empty-state');
  if (empty) empty.remove();

  const div = document.createElement('div');
  div.className = 'token-usage';

  const parts = [];
  if (usage.prompt_tokens !== undefined) {
    parts.push(`<span class="token-stat"><span class="token-label">IN</span> ${usage.prompt_tokens}</span>`);
  }
  if (usage.completion_tokens !== undefined) {
    parts.push(`<span class="token-stat"><span class="token-label">OUT</span> ${usage.completion_tokens}</span>`);
  }
  if (usage.total_tokens !== undefined) {
    parts.push(`<span class="token-stat"><span class="token-label">TOTAL</span> ${usage.total_tokens}</span>`);
  }

  div.innerHTML = parts.join('') || `<span class="token-stat">Tokens used</span>`;
  DOM.messages.appendChild(div);
  scrollToBottom();
}

function addToolCall(name, args, result) {
  const empty = DOM.messages.querySelector('.empty-state');
  if (empty) empty.remove();

  const wrapper = document.createElement('div');
  wrapper.className = 'tool-call-wrapper';

  const argsPreview = typeof args === 'object' ? JSON.stringify(args).slice(0, 100) : String(args || '');
  const resultText = result?.output || result?.error || (typeof result === 'string' ? result : JSON.stringify(result || {}));

  wrapper.innerHTML = `
    <button class="tool-call-toggle">
      <span class="tool-icon">&#x2699;</span>
      <span class="tool-name">${escapeHtml(name)}</span>
      <span style="color:var(--text-muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;">${escapeHtml(argsPreview)}</span>
      <span class="tool-chevron">&#x25B6;</span>
    </button>
    <div class="tool-call-body">
      <div class="tool-section">
        <div class="tool-section-label">Arguments</div>
        <div class="tool-section-content">${escapeHtml(typeof args === 'string' ? args : JSON.stringify(args, null, 2))}</div>
      </div>
      <div class="tool-section">
        <div class="tool-section-label">Result</div>
        <div class="tool-section-content">${escapeHtml(resultText)}</div>
      </div>
    </div>
  `;

  const toggle = wrapper.querySelector('.tool-call-toggle');
  const body = wrapper.querySelector('.tool-call-body');
  toggle.addEventListener('click', () => {
    toggle.classList.toggle('open');
    body.classList.toggle('open');
  });

  DOM.messages.appendChild(wrapper);
  scrollToBottom();
  return wrapper;
}

function scrollToBottom() {
  DOM.messages.scrollTop = DOM.messages.scrollHeight;
}

// ── Event Processing ─────────────────────────────────────────────────────
// ResponseEvent JSON: key is variant name, value is the data object.

function appendEvent(eventObj) {
  const keys = Object.keys(eventObj);
  const type = keys[0];
  const data = eventObj[type];

  switch (type) {
    case 'turn_started':
      addMessage('system', `Turn started${data?.turn_id ? ': ' + data.turn_id : ''}`);
      break;

    case 'agent_message_delta':
      // Delta accumulation: find the last assistant message body and append
      let lastMsg = DOM.messages.querySelector('.msg.assistant:last-of-type');
      if (!lastMsg) {
        lastMsg = addMessage('assistant', data?.content || '');
      } else {
        const bodyEl = lastMsg.querySelector('.msg-body');
        // Re-render markdown for accumulated content
        const currentText = bodyEl.textContent + (data?.content || '');
        bodyEl.innerHTML = renderMarkdown(currentText);
      }
      break;

    case 'tool_call_begin': {
      const tc = data?.tool_call || data || {};
      const toolName = tc.name || 'unknown';
      const toolArgs = tc.arguments || {};
      // Store for pairing with ToolCallEnd
      const wrapper = addToolCall(toolName, toolArgs, null);
      wrapper._toolName = toolName;
      // Mark as pending
      wrapper.querySelector('.tool-call-toggle').querySelector('.tool-name').textContent = toolName + ' (running...)';
      break;
    }

    case 'tool_call_end': {
      const result = data?.result || {};
      const toolName = result.tool_call_id || data?.tool_call_id || 'unknown';

      // Find the last tool call wrapper and update it
      const wrappers = DOM.messages.querySelectorAll('.tool-call-wrapper');
      if (wrappers.length > 0) {
        const lastWrapper = wrappers[wrappers.length - 1];
        const body = lastWrapper.querySelector('.tool-call-body');
        const toggle = lastWrapper.querySelector('.tool-call-toggle');

        // Update result section
        const resultSection = body.querySelectorAll('.tool-section')[1];
        if (resultSection) {
          const resultContent = resultSection.querySelector('.tool-section-content');
          const resultText = result?.output || result?.error || JSON.stringify(result, null, 2);
          resultContent.textContent = typeof resultText === 'object' ? JSON.stringify(resultText, null, 2) : resultText;
        }

        // Update status
        toggle.querySelector('.tool-name').textContent = toolName;
      }
      break;
    }

    case 'turn_complete':
      addMessage('system', 'Turn complete');
      break;

    case 'error':
      addMessage('error', data?.message || data?.error || 'Unknown error');
      break;

    case 'token_usage': {
      addTokenUsage(data || {});
      break;
    }

    default:
      // Unknown event, log as system
      addMessage('system', JSON.stringify(eventObj, null, 2));
  }
}

// ── SSE Stream Handling ──────────────────────────────────────────────────
async function sendMessage() {
  const text = DOM.input.value.trim();
  if (!text || !STATE.activeThreadId || STATE.streaming) return;

  DOM.input.value = '';
  resetInputHeight();
  addMessage('user', text);

  STATE.streaming = true;
  STATE.streamAbort = new AbortController();
  DOM.sendBtn.disabled = true;
  DOM.cancelBtn.classList.add('visible');
  DOM.connStatus.textContent = 'streaming';
  DOM.connStatus.style.color = 'var(--accent)';

  // Track the last assistant message element for delta accumulation
  let lastAssistantBody = null;

  try {
    const res = await fetch(`${BASE}/threads/${encodeURIComponent(STATE.activeThreadId)}/turns`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ message: text }),
      signal: STATE.streamAbort.signal,
    });

    if (!res.ok) {
      let msg = `HTTP ${res.status}`;
      try { const b = await res.json(); msg = b.error || msg; } catch {}
      throw new Error(msg);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let eventType = '';    // inner event type
    let eventData = '';    // inner JSON data

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        // Axum SSE wraps the inner SSE: "data: event: xxx\ndata: {...}\n\n"
        if (line.startsWith('data: ')) {
          const inner = line.slice(6);

          if (inner.startsWith('event: ')) {
            eventType = inner.slice(7).trim();
            eventData = '';
          } else if (inner.startsWith('data: ')) {
            eventData = inner.slice(6).trim();
          } else {
            // The entire inner data might be the event (no "event:" prefix)
            eventData = inner.trim();
          }
        } else if (line === '' && eventData) {
          // End of inner SSE event — process it
          try {
            const parsed = JSON.parse(eventData);
            appendEvent(parsed);
          } catch (e) {
            // Non-JSON data, ignore
          }
          eventType = '';
          eventData = '';
        }
      }

      scrollToBottom();
    }

    // Flush remaining buffer
    if (buffer.trim() && eventData) {
      try {
        const parsed = JSON.parse(eventData);
        appendEvent(parsed);
      } catch {}
    }

    DOM.connStatus.textContent = 'connected';
    DOM.connStatus.style.color = '';

    // Refresh thread info after turn
    if (STATE.activeThreadId) {
      try {
        const res = await apiFetch(`/threads/${encodeURIComponent(STATE.activeThreadId)}/events`);
        const data = await res.json();
        STATE.eventHistory[STATE.activeThreadId] = data.events || [];
        renderThreadInfo(STATE.activeThreadId);
      } catch {}
    }

  } catch (err) {
    if (err.name === 'AbortError') {
      addMessage('system', 'Stream cancelled');
    } else {
      addMessage('error', `Stream error: ${err.message}`);
      toast(`Stream error: ${err.message}`, 'error');
    }
  } finally {
    STATE.streaming = false;
    STATE.streamAbort = null;
    DOM.sendBtn.disabled = false;
    DOM.cancelBtn.classList.remove('visible');
    DOM.input.focus();
    if (DOM.connStatus.textContent === 'streaming') {
      DOM.connStatus.textContent = 'connected';
      DOM.connStatus.style.color = '';
    }
  }
}

function cancelStream() {
  if (STATE.streamAbort) {
    STATE.streamAbort.abort();
    STATE.streamAbort = null;
  }
}

// ── Input Helpers ────────────────────────────────────────────────────────
function resetInputHeight() {
  DOM.input.style.height = 'auto';
}

// ── Event Listeners ──────────────────────────────────────────────────────
DOM.newThreadBtn.addEventListener('click', createThread);
DOM.sendBtn.addEventListener('click', sendMessage);
DOM.cancelBtn.addEventListener('click', cancelStream);

DOM.input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

DOM.input.addEventListener('input', () => {
  DOM.input.style.height = 'auto';
  DOM.input.style.height = Math.min(DOM.input.scrollHeight, 150) + 'px';
});

DOM.infoPanelToggle.addEventListener('click', () => {
  DOM.infoPanel.style.display = DOM.infoPanel.style.display === 'none' ? '' : 'none';
});

// ── Initialization ───────────────────────────────────────────────────────
async function init() {
  DOM.connStatus.textContent = 'connecting...';
  DOM.connStatus.style.color = 'var(--warning-color)';

  await checkHealth();
  if (STATE.healthOnline) {
    DOM.connStatus.textContent = 'connected';
    DOM.connStatus.style.color = '';
    await loadThreads();
  } else {
    DOM.connStatus.textContent = 'server offline';
    DOM.connStatus.style.color = 'var(--error-color)';
    toast('Cannot connect to server. Is code-agent-web running?', 'error');
    updateSidebarError('Server not reachable. Check that code-agent-web is running on this host.');
  }
}

// Health check polling every 30s
setInterval(checkHealth, 30000);

// Periodic thread list refresh when not streaming
setInterval(async () => {
  if (!STATE.streaming && STATE.healthOnline) {
    try {
      const res = await apiFetch('/threads');
      const data = await res.json();
      const newThreads = data.threads || [];
      // Only update if changed (avoid re-render flicker)
      const changed = newThreads.length !== STATE.threads.length ||
        newThreads.some((t, i) => t !== STATE.threads[i]);
      if (changed) {
        STATE.threads = newThreads;
        renderThreadList();
      }
    } catch {}
  }
}, 10000);

init();
</script>
</body>
</html>
