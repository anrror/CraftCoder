[package]
name = "code-agent-core"
version = "0.1.0"
edition = "2021"
description = "Core model client abstraction and provider implementations for the AI Coding Agent"
license = "MIT"

[features]
default = ["observability"]
observability = ["tracing-subscriber", "tracing-appender"]
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]

[dependencies]
code-agent-protocol = { path = "../protocol" }

reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
tracing-appender = { version = "0.2", optional = true }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
regex = "1"
glob = "0.3"
bytes = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }

# OpenTelemetry — optional, for production OTLP export
opentelemetry = { version = "0.24", optional = true }
opentelemetry_sdk = { version = "0.24", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.17", optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }

[dev-dependencies]
httpmock = "0.7"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
tempfile = "3"
