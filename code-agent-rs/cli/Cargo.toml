[package]
name = "code-agent-cli"
version = "0.1.0"
edition = "2021"
description = "Interactive Terminal UI for the AI Coding Agent"

[dependencies]
code-agent-protocol = { path = "../protocol" }
code-agent-core = { path = "../core" }
code-agent-eval = { path = "../eval" }
code-agent-app-server = { path = "../app-server" }

ratatui = "0.28"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "process", "io-util"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
textwrap = "0.16"
uuid = { version = "1", features = ["v4"] }
similar = "3"

[dev-dependencies]
insta = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
