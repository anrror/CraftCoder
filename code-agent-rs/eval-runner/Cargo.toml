[package]
name = "eval-runner"
version = "0.1.0"
edition = "2021"
description = "CLI entry point for running benchmarks and comparing results — powers the CI eval pipeline"
license = "MIT"
rust-version = "1.80"

[[bin]]
name = "eval-runner"
path = "src/main.rs"

[dependencies]
code-agent-eval = { path = "../eval", features = ["remote-datasets"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
