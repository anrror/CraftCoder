[package]
name = "code-agent-protocol"
version = "0.1.0"
edition = "2021"
description = "Shared protocol types and core data models for the AI Coding Agent"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
derive_more = { version = "2", features = ["display", "from", "into"] }
