[package]
name = "code-agent-app-server"
version = "0.1.0"
edition = "2021"
description = "JSON-RPC 2.0 App Server for IDE integration with the AI Coding Agent"
license = "MIT"

[[bin]]
name = "code-agent-app-server"
path = "src/main.rs"

[dependencies]
code-agent-core = { path = "../core" }
code-agent-protocol = { path = "../protocol" }
code-agent-tools = { path = "../tools" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
