name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
          - os: macos-13
            target: x86_64-apple-darwin
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: code-agent-rs
          key: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: code-agent-rs/code-agent-web/ui/package-lock.json

      - name: Build React UI
        shell: bash
        run: |
          cd code-agent-rs/code-agent-web/ui
          npm ci
          npm run build

      - name: Build Rust release
        run: cargo build --release -p code-agent-cli -p code-agent-app-server -p code-agent-web --target ${{ matrix.target }} --manifest-path code-agent-rs/Cargo.toml

      - name: Package binaries + static assets
        shell: bash
        run: |
          RELEASE_DIR="code-agent-rs/target/${{ matrix.target }}/release"
          ARTIFACT_NAME="craftcoder-${{ matrix.target }}"
          SUFFIX="${{ matrix.suffix }}"

          # Staging: structure so binaries and static/ live side by side
          STAGING_DIR="${RUNNER_TEMP}/staging"
          rm -rf "${STAGING_DIR}"
          mkdir -p "${STAGING_DIR}/static"

          cp "$RELEASE_DIR/code-agent-cli${SUFFIX}"   "${STAGING_DIR}/"
          cp "$RELEASE_DIR/code-agent-app-server${SUFFIX}" "${STAGING_DIR}/"
          cp "$RELEASE_DIR/code-agent-web${SUFFIX}"   "${STAGING_DIR}/"
          cp -r code-agent-rs/code-agent-web/static/*  "${STAGING_DIR}/static/"

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cd "${STAGING_DIR}"
            7z a "${GITHUB_WORKSPACE}/${ARTIFACT_NAME}.zip" .
            cd "${GITHUB_WORKSPACE}"
          else
            tar czf "${ARTIFACT_NAME}.tar.gz" -C "${STAGING_DIR}" .
          fi
          echo "artifact=${ARTIFACT_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: craftcoder-${{ matrix.target }}
          path: craftcoder-${{ matrix.target }}.*

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: craftcoder-*
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: craftcoder-*
          generate_release_notes: true
